name: pft

services:
  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      portal:
        condition: service_healthy
      finance-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - edge

  portal:
    build:
      context: ./portal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - edge

  finance-frontend:
    build:
      context: ../..
      dockerfile: infra/docker/finance-frontend.Dockerfile
      args:
        NEXT_BASE_PATH: /finance
    restart: unless-stopped
    environment:
      FASTAPI_BASE_URL: http://finance-backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      finance-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/finance').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - edge
      - finance-internal

  finance-backend:
    build:
      context: ../..
      dockerfile: infra/docker/finance-backend.Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/pft/finance/backend.env
    volumes:
      - /etc/pft/finance/wallet:/opt/oracle/wallet:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/database', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - finance-internal
      - backend-egress

networks:
  edge:
    driver: bridge
  finance-internal:
    driver: bridge
    internal: true
  backend-egress:
    driver: bridge
