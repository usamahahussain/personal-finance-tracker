<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal applications</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #111827; color: #f9fafb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(680px, calc(100% - 3rem)); }
      h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 5vw, 3rem); }
      p { color: #9ca3af; line-height: 1.6; }
      a { display: block; margin-top: 2rem; padding: 1.25rem 1.5rem; border-radius: .9rem; color: inherit; text-decoration: none; background: #1f2937; border: 1px solid #374151; }
      a:hover, a:focus-visible { border-color: #60a5fa; background: #273449; }
      strong, span { display: block; }
      strong { font-size: 1.15rem; }
      span { margin-top: .3rem; color: #9ca3af; }
    </style>
  </head>
  <body>
    <main>
      <h1>Personal applications</h1>
      <p>Select an application hosted on this VM.</p>
      <a href="/finance"><strong>Personal Finance Tracker</strong><span>Balances, transactions, categories, and recurring payments.</span></a>
    </main>
  </body>
</html>
